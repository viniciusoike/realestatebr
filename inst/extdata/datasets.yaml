# Dataset Registry for realestatebr package
# This file contains metadata for all available datasets

datasets:
  abecip:
    name: "ABECIP Housing Credit Indicators"
    name_pt: "Indicadores de Crédito Habitacional ABECIP"
    description: "Housing credit data from Brazilian housing finance system (SFH) including SBPE flows, financed units, and home equity loans"
    source: "ABECIP - Associação Brasileira das Entidades de Crédito Imobiliário"
    url: "https://www.abecip.org.br"
    geography: "Brazil"
    frequency: "monthly"
    coverage: "1982-present (varies by category)"
    update_schedule: "weekly"
    warn_after_days: 14
    categories:
      sbpe:
        name: "SBPE Monetary Flows"
        description: "Monetary flows from SBPE (Sistema Brasileiro de Poupança e Empréstimo)"
        coverage: "January 1982-present"
        columns:
          date: "Reference month."
          sbpe_inflow: "Deposits into SBPE savings accounts during the month (R$ million; historical values in the currency of the period)."
          sbpe_outflow: "Withdrawals from SBPE savings accounts during the month (R$ million)."
          sbpe_netflow: "Net savings flow: inflow minus outflow (R$ million)."
          sbpe_netflow_pct: "Net flow as a share of the SBPE savings stock."
          sbpe_yield: "Interest credited to SBPE savings accounts (R$ million)."
          sbpe_stock: "End-of-month SBPE savings stock (R$ million)."
          rural_inflow: "Deposits into rural savings accounts during the month (R$ million)."
          rural_outflow: "Withdrawals from rural savings accounts during the month (R$ million)."
          rural_netflow: "Net rural savings flow: inflow minus outflow (R$ million)."
          rural_netflow_pct: "Net rural flow as a share of the rural savings stock."
          rural_yield: "Interest credited to rural savings accounts (R$ million)."
          rural_stock: "End-of-month rural savings stock (R$ million)."
          total_stock: "Combined SBPE and rural savings stock (R$ million)."
          total_netflow: "Combined SBPE and rural net savings flow (R$ million)."
      units:
        name: "Financed Units"
        description: "Number of units financed by SBPE, split by construction and acquisition"
        coverage: "January 2002-present"
        columns:
          date: "Reference month."
          units_construction: "Number of units financed for construction."
          units_acquisition: "Number of units financed for acquisition."
          units_total: "Total number of financed units."
          currency_construction: "Value of construction financing (R$ million)."
          currency_acquisition: "Value of acquisition financing (R$ million)."
          currency_total: "Total value of financing (R$ million)."
      cgi:
        name: "Home Equity Loans (CGI)"
        description: "Summary data on home equity loans including default rates and average terms"
        coverage: "January 2017-present"
        columns:
          year: "Reference year."
          date: "Reference month."
          new_contracts: "Number of new home equity loan contracts signed in the month."
          stock_contracts: "Number of outstanding contracts at the end of the month."
          loan: "Value of new loans granted in the month (R$)."
          outstanding_balance: "Outstanding loan balance at the end of the month (R$)."
          average_term: "Average contract term (months)."
          default_rate: "Share of loans in default (percent)."
    internal_function: "fetch_abecip"
    dataset_function: "get_abecip_indicators"
    data_type: "list"
    cached_file:
      sbpe: "abecip_sbpe.rds"
      units: "abecip_units.rds"
      cgi: "abecip_cgi.rds"
    translation_notes: "Column names translated from Portuguese to English following standard patterns"

  abrainc:
    name: "ABRAINC-FIPE Primary Market Indicators"
    name_pt: "Indicadores ABRAINC-FIPE do Mercado Primário"
    description: "Primary real estate market indicators including launches, sales, and business conditions from 66+ partnered developers"
    source: "ABRAINC/FIPE"
    url: "https://www.fipe.org.br/pt-br/indices/abrainc"
    geography: "Brazil (major cities)"
    frequency: "quarterly"
    coverage: "2014-present"
    update_schedule: "weekly"
    warn_after_days: 14
    categories:
      indicator:
        name: "Market Indicators"
        description: "Broad numbers of launches, sales, supply in the primary market"
        columns:
          date: "Reference month."
          year: "Reference year."
          category: "Indicator group (e.g. new_units, sold, delivered)."
          variable: "Market segment: total, market_rate, or social_housing (MCMV and related programs)."
          value: "Number of units."
          variable_label: "Human-readable label for variable."
      radar:
        name: "Business Radar"
        description: "0-10 standardized index for general business conditions"
        columns:
          date: "Reference month."
          year: "Reference year."
          category: "Radar dimension (e.g. macro, credit, demand)."
          variable: "Indicator within the dimension (e.g. confidence, activity, interest)."
          source: "Source of the underlying series (e.g. FGV, BCB)."
          value: "Standardized 0-10 score."
          avg_category: "Average score of the category over the full sample."
          avg_year_category: "Average score of the category in the year."
          avg_year_variable: "Average score of the variable in the year."
          ma3: "3-month moving average of value."
          ma6: "6-month moving average of value."
          variable_label: "Human-readable label for variable."
      leading:
        name: "Leading Indicator"
        description: "Building permits in São Paulo as real estate leading indicator"
        columns:
          date: "Reference month."
          year: "Reference year."
          variable: "Series identifier: leading_index, leading_index_12m, or alvaras_total (building permits)."
          zone: "São Paulo city zone (Total, Centro, Zona Norte, and others)."
          value: "Series value; index points, percent change, or permit counts depending on variable."
          variable_label: "Human-readable label for variable."
    internal_function: "fetch_abrainc"
    dataset_function: "get_abrainc_indicators"
    data_type: "list"
    cached_file:
      indicator: "abrainc_indicator.rds"
      radar: "abrainc_radar.rds"
      leading: "abrainc_leading.rds"
    translation_notes: "Social Housing (MCMV) refers to Minha Casa Minha Vida and Casa Verde Amarela programs"

  bcb_realestate:
    name: "BCB Real Estate Market Data"
    name_pt: "Dados do Mercado Imobiliário BCB"
    description: "Comprehensive real estate credit and market data from Brazilian Central Bank"
    source: "Banco Central do Brasil"
    url: "https://dadosabertos.bcb.gov.br/dataset/informacoes-do-mercado-imobiliario"
    geography: "Brazil (by state)"
    frequency: "monthly"
    coverage: "2001-present (varies by category)"
    update_schedule: "weekly"
    warn_after_days: 14
    categories:
      accounting:
        name: "Credit Accounting"
        description: "Credit accounting and balance sheet data"
      application:
        name: "Credit Applications"
        description: "Credit application statistics and approvals"
      indices:
        name: "Real Estate Indices"
        description: "Various real estate market indices"
      sources:
        name: "Credit Sources"
        description: "Breakdown of credit sources and funding"
      units:
        name: "Financed Units"
        description: "Number and value of financed units"
    columns:
      date: "End-of-month reference date (last day of the month)."
      category: "Top-level series grouping (e.g. credito, contabil, direcionamento, fontes, imoveis)."
      type: "Series subtype within the category (e.g. estoque, contratacao, financiamento)."
      v1: "Series identifier component 1; meaning varies by series (e.g. carteira, borrower type, region)."
      v2: "Series identifier component 2 (e.g. br, pf, pj)."
      v3: "Series identifier component 3 (e.g. credit line such as sfh, fgts, home-equity)."
      v4: "Series identifier component 4 (often a state abbreviation or credit line)."
      v5: "Series identifier component 5 (often a state abbreviation or br)."
      series_info: "Full underscore-separated series identifier; together with date it uniquely identifies an observation."
      value: "Series value; unit varies by series (R$, units, or percent)."
      year: "Reference year."
      month: "Reference month (1-12)."
      abbrev_state: "Two-letter state abbreviation, or BR for the national aggregate."
    internal_function: "fetch_bcb_realestate"
    dataset_function: "get_bcb_realestate"
    data_type: "tibble"
    cached_file: "bcb_realestate.rds"
    default_table: "all"
    translation_notes: "Complex multi-level series structure; v1-v5 columns contain series components"
    
  secovi:
    name: "SECOVI-SP Real Estate Market Data"
    name_pt: "Dados do Mercado Imobiliário SECOVI-SP"
    description: "São Paulo real estate market indicators including condominium fees, rentals, launches, and sales"
    source: "SECOVI-SP - Sindicato da Habitação"
    url: "https://www.secovi.com.br"
    geography: "São Paulo"
    frequency: "monthly"
    coverage: "2004-present (varies by category)"
    update_schedule: "weekly"
    warn_after_days: 14
    categories:
      condo:
        name: "Condominium Fees"
        description: "Average condominium fees by region and property type"
      rent:
        name: "Rental Market"
        description: "Rental prices and market dynamics"
      launch:
        name: "New Launches"
        description: "New real estate project launches"
      sale:
        name: "Sales Market"
        description: "Sales prices and transaction volumes"
    columns:
      date: "Reference month."
      category: "Market segment: condo, rent, launch, or sale."
      variable: "Indicator within the category (e.g. icon, default_condominio, acao_locaticia)."
      name: "Breakdown dimension of the indicator (region, property type, or total)."
      value: "Indicator value; unit varies by variable."
    internal_function: "fetch_secovi"
    dataset_function: "get_secovi"
    data_type: "tibble"
    cached_file: "secovi_sp.rds"
    default_table: "all"
    translation_notes: "Regional classifications specific to São Paulo metropolitan area"
    
  rppi_bis:
    name: "BIS Residential Property Price Indices"
    name_pt: "Índices de Preços Residenciais BIS"
    description: "International residential property price indices from Bank for International Settlements"
    source: "Bank for International Settlements"
    url: "https://data.bis.org/topics/RPP"
    geography: "International (60+ countries including Brazil)"
    frequency: "quarterly"
    coverage: "1970-present (varies by country)"
    update_schedule: "monthly"
    warn_after_days: 60
    categories:
      selected:
        name: "Selected Series"
        description: "Core RPPI series for major countries"
        url: "https://www.bis.org/statistics/pp_selected.htm"
        columns:
          date: "Reference quarter (first day of the quarter)."
          ref_area_code: "Country or area code (aggregates use BIS codes such as 4T)."
          ref_area_name: "Country or area name."
          unit: "Measure: index (2010 = 100) or yoy_chg (year-on-year change, percent)."
          unit_name: "Full description of the unit of measure."
          is_nominal: "1 for nominal series, 0 for CPI-deflated (real) series."
          series_code: "BIS series identifier."
          value: "Series value."
      detailed_monthly:
        name: "Detailed Monthly"
        description: "Monthly detailed RPPI data"
        url: "https://data.bis.org/topics/RPP"
        columns: &bis_detailed_columns
          date: "Reference period."
          year: "Reference year."
          series_code: "BIS series identifier."
          ref_area_code: "Country or area code."
          ref_area_name: "Country or area name."
          re_type_code: "Property type code."
          re_type_name: "Property type (e.g. all types, new or existing dwellings)."
          re_vintage_code: "Property vintage code."
          re_vintage_name: "Property vintage (new versus existing)."
          compiling_org_code: "Compiling organisation code."
          compiling_org_name: "Compiling organisation."
          priced_unit_code: "Priced unit code."
          priced_unit_name: "Priced unit (e.g. dwelling, square metre)."
          seas_adjust_code: "Seasonal adjustment code."
          seas_adjust_name: "Seasonal adjustment description."
          availability_code: "Series availability code."
          availability_name: "Series availability description."
          unit_code: "Unit of measure code."
          unit_name: "Unit of measure description."
          unit_mult_code: "Unit multiplier code."
          unit_mult_name: "Unit multiplier description."
          value: "Series value."
        column_notes: "Frequency-specific period columns (month, quarter, or semester) and a few metadata columns vary slightly across the detailed tables."
      detailed_quarterly:
        name: "Detailed Quarterly"
        description: "Quarterly detailed RPPI data"
        url: "https://data.bis.org/topics/RPP"
        columns: *bis_detailed_columns
      detailed_annual:
        name: "Detailed Annual"
        description: "Annual detailed RPPI data"
        url: "https://data.bis.org/topics/RPP"
        columns: *bis_detailed_columns
      detailed_halfyearly:
        name: "Detailed Half-yearly"
        description: "Half-yearly detailed RPPI data"
        url: "https://data.bis.org/topics/RPP"
        columns: *bis_detailed_columns
    internal_function: "fetch_bis"
    dataset_function: "get_rppi_bis"
    data_type: "tibble"
    cached_file:
      selected: "bis_selected.rds"
      detailed_monthly: "rppi_bis_detailed_monthly.rds"
      detailed_quarterly: "rppi_bis_detailed_quarterly.rds"
      detailed_annual: "rppi_bis_detailed_annual.rds"
      detailed_halfyearly: "rppi_bis_detailed_halfyearly.rds"
    translation_notes: "International data; minimal translation needed"

  rppi:
    name: "Brazilian Residential Property Price Indices"
    name_pt: "Índices de Preços Residenciais Brasileiros"
    description: "Comprehensive collection of all Brazilian residential property price indices"
    source: "Multiple (FIPE/ZAP, IVGR, IGMI, IQA, IQAIW, IVAR, SECOVI-SP)"
    url: "varies by index"
    geography: "Brazil"
    frequency: "monthly"
    coverage: "varies by index"
    update_schedule: "weekly"
    warn_after_days: 14
    categories:
      # Individual indices
      fipezap:
        name: "FIPE-ZAP Index"
        description: "FIPE-ZAP residential property price index"
        type: "sales"
        coverage: "Major cities"
        source: "FIPE/ZAP Imóveis"
        columns:
          date: "Reference month."
          name_muni: "City name or aggregate (e.g. Índice Fipezap)."
          market: "Market segment: residential or commercial."
          rent_sale: "Transaction type: sale or rent."
          variable: "Measure: index, chg, acum12m, price_m2, or yield."
          rooms: "Number of bedrooms (total, 1, 2, 3, or 4)."
          value: "Value of the measure."
      ivgr:
        name: "IVGR - Índice de Valores Gerais Residenciais"
        description: "General residential values index"
        type: "sales"
        coverage: "National"
        source: "IVGR"
        columns:
          date: "Reference month."
          name_geo: "Geographic area (Brazil)."
          index: "Price index level."
          chg: "Month-on-month change of the index."
          acum12m: "Accumulated 12-month change of the index."
      igmi:
        name: "IGMI - Índice Geral do Mercado Imobiliário"
        description: "General real estate market index"
        type: "sales"
        coverage: "São Paulo"
        source: "IGMI"
        columns:
          date: "Reference month."
          name_muni: "City name or national aggregate."
          index: "Price index level."
          chg: "Month-on-month change of the index."
          acum12m: "Accumulated 12-month change of the index."
      iqa:
        name: "IQA - Índice QuintoAndar"
        description: "QuintoAndar rent price index"
        type: "rent"
        coverage: "Major cities"
        source: "QuintoAndar"
        columns:
          date: "Reference month."
          name_muni: "City name."
          index: "Rent index level."
          chg: "Month-on-month change of the index."
          acum12m: "Accumulated 12-month change of the index."
      iqaiw:
        name: "IQAIW - Índice QuintoAndar ImovelWeb"
        description: "QuintoAndar ImovelWeb hedonic rent price index"
        type: "rent"
        coverage: "Major cities (6 cities)"
        source: "QuintoAndar"
        columns:
          date: "Reference month."
          name_muni: "City name."
          rooms: "Number of bedrooms (total, 1, 2, 3, or 4)."
          index: "Rent index level."
          chg: "Month-on-month change of the index."
          acum12m: "Accumulated 12-month change of the index."
      ivar:
        name: "IVAR - Índice de Valores de Aluguéis Residenciais"
        description: "Residential rent values index"
        type: "rent"
        coverage: "National"
        source: "IVAR"
        columns:
          date: "Reference month."
          name_muni: "City name or national aggregate."
          index: "Rent index level."
          chg: "Month-on-month change of the index."
          acum12m: "Accumulated 12-month change of the index."
      secovi_sp:
        name: "SECOVI-SP Index"
        description: "São Paulo real estate syndicate index"
        type: "both"
        coverage: "São Paulo"
        source: "SECOVI-SP"
        columns:
          date: "Reference month."
          name_muni: "City name (São Paulo)."
          index: "Rent index level."
          chg: "Month-on-month change of the index."
          acum12m: "Accumulated 12-month change of the index."
      # Aggregation categories (stacked data)
      sale:
        name: "Stacked Sale Indices"
        description: "Harmonized combination of all sale-related indices with source column"
        includes: ["igmi", "ivgr", "fipezap_sale_only"]
        data_structure: "Standardized columns with source identification"
        note: "FipeZap filtered to residential/total/sale for consistent stacking"
        columns:
          source: "Index source: IVG-R, IGMI-R, or FipeZap."
          date: "Reference month."
          name_muni: "City name or aggregate (e.g. Brazil)."
          index: "Price index level (each source has its own base period)."
          chg: "Month-on-month change of the index."
          acum12m: "Accumulated 12-month change of the index."
      rent:
        name: "Stacked Rent Indices"
        description: "Harmonized combination of all rent-related indices with source column"
        includes: ["ivar", "iqaiw", "fipezap_rent_only"]
        data_structure: "Standardized columns with source identification"
        note: "FipeZap filtered to residential/total/rent for consistent stacking"
        columns:
          source: "Index source: IVAR, IQAIW, or FipeZap."
          date: "Reference month."
          name_muni: "City name or aggregate (e.g. Brazil)."
          index: "Rent index level (each source has its own base period)."
          chg: "Month-on-month change of the index."
          acum12m: "Accumulated 12-month change of the index."
      all:
        name: "All Indices Combined"
        description: "Complete stacked dataset with transaction_type indicator"
        includes: ["all sale indices", "all rent indices"]
        data_structure: "Includes both source and transaction_type columns"
        columns:
          source: "Index source (e.g. IVG-R, IGMI-R, IVAR, IQAIW, FipeZap)."
          date: "Reference month."
          name_muni: "City name or aggregate (e.g. Brazil)."
          index: "Index level (each source has its own base period)."
          chg: "Month-on-month change of the index."
          acum12m: "Accumulated 12-month change of the index."
          transaction_type: "Transaction type: sale or rent."
    internal_function: "fetch_rppi"
    dataset_function: "get_rppi"
    data_type: "mixed"
    cached_file:
      sale: "rppi_sale.rds"
      rent: "rppi_rent.rds"
      fipezap: "rppi_fipe.csv.gz"
      ivgr: "rppi_ivgr.csv.gz"
      igmi: "rppi_igmi.csv.gz"
      iqa: "rppi_iqa.csv.gz"
      iqaiw: "rppi_iqaiw.csv.gz"
      ivar: "rppi_ivar.csv.gz"
      secovi_sp: "rppi_secovi_sp.csv.gz"
    translation_notes: "Index methodologies vary by source; base periods normalized where possible"

  bcb_series:
    name: "BCB Economic Series"
    name_pt: "Séries Econômicas BCB"
    description: "General economic and real estate related time series from Brazilian Central Bank"
    source: "Banco Central do Brasil - SGS"
    url: "https://www3.bcb.gov.br/sgspub"
    geography: "Brazil"
    frequency: "varies (daily/monthly/quarterly)"
    coverage: "varies by series"
    update_schedule: "weekly"
    warn_after_days: 14
    categories:
      core:
        name: "Core Real Estate Series"
        description: "Core real estate credit series (concession, rates, delinquency)"
      primary:
        name: "Primary Series"
        description: "Core series plus secondary real estate and key macro series (SELIC, IPCA, INCC)"
      secondary:
        name: "Secondary Series"
        description: "Primary series plus broader macroeconomic context (GDP, unemployment, income)"
      tertiary:
        name: "Tertiary Series"
        description: "All series including less relevant macro and discontinued series"
      full:
        name: "Full Series"
        description: "All available series (equivalent to tertiary)"
    columns:
      date: "Reference date (frequency varies by series)."
      code_bcb: "Numeric code of the series in the BCB SGS system."
      name_simplified: "Short series identifier; see the bundled bcb_metadata table for full names and units."
      value: "Series value."
    internal_function: "fetch_bcb_series"
    dataset_function: "get_bcb_series"
    data_type: "tibble"
    cached_file: "bcb_series.rds"
    default_table: "core"
    metadata_table: "bcb_metadata"
    translation_notes: "Metadata available in both Portuguese and English"


  fgv_ibre:
    name: "FGV IBRE Real Estate Indicators"
    name_pt: "Indicadores Imobiliários FGV IBRE"
    description: "Real estate market indicators from Fundação Getulio Vargas IBRE"
    source: "FGV IBRE"
    url: "https://portalibre.fgv.br"
    geography: "Brazil"
    frequency: "monthly"
    coverage: "2010-present"
    columns:
      date: "Reference month."
      name_simplified: "Short series identifier (e.g. incc_brasil_di, ivar_brazil, ic_cst)."
      value: "Series value."
      name_series: "Full series name in Portuguese."
      code_series: "FGV series code."
      unit: "Unit of the series (index, percent, or indicator)."
      source: "FGV survey of origin (e.g. FGV-INCC, FGV-SONDA)."
    internal_function: "fetch_fgv"
    dataset_function: "get_fgv_ibre"
    data_type: "tibble"
    cached_file: "fgv_ibre.rds"
    translation_notes: "Technical economic terms; standard translations applied"
    manual_update: true
    update_notes: "No public API available; requires manual download and processing"
    update_schedule: "weekly"
    warn_after_days: 14


