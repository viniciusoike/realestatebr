url: https://viniciusoike.github.io/realestatebr/
template:
  bootstrap: 5
  bslib:
    bootswatch: yeti
    primary: "#0D1B2A"
    heading_font: {google: "Lora"}
    code_font: {google: "JetBrains Mono"}
    "code-font-size": 0.82em

logo:
  src: man/figures/hexlogo.png
  alt: "realestatebr hexsticker"

reference:
  - title: "Access data"
    desc: "Discover and retrieve datasets"
    contents:
      - get_dataset
      - list_datasets
      - get_dataset_info
      - clear_session_cache
  - title: "Datasets"
    desc: "Table and column documentation for each dataset"
    contents:
      - abecip
      - abrainc
      - bcb_realestate
      - bcb_series
      - fgv_ibre
      - rppi
      - rppi_bis
      - secovi
  - title: "Bundled tables"
    desc: "Auxiliary data shipped with the package"
    contents:
      - bcb_metadata
      - dim_city
      - b3_real_estate

articles:
  - title: "Get started"
    navbar: ~
    contents:
      - getting-started
      - articles/working-with-rppi
  - title: "Market deep dives"
    navbar: Market deep dives
    contents:
      - articles/housing-credit
      - articles/primary-market
  - title: internal
    contents:
      - articles/realestatebr-1-0-1

news:
  releases:
  - text: "Version 1.0.1"
    href: articles/realestatebr-1-0-1.html

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/viniciusoike/realestatebr
      aria-label: GitHub
