# Replaces the r-lib pkgdown example workflow with a call to the shared
# reusable workflow (https://github.com/viniciusoike/.github) so every
# package gets the same build/deploy behavior from one place — including
# dropping internal agent docs (AGENTS.md, CLAUDE.md, ...) before the site
# build, because pkgdown renders every root-level .md into the published
# site, sitemap and search index (r-lib/pkgdown#2959).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    uses: viniciusoike/.github/.github/workflows/pkgdown.yml@main
    with:
      internal_md_docs: "CLAUDE.md AGENTS.md"
