name: Build CNO Snapshot

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Direct URL for the complete Receita Federal CNO archive
        required: true
        type: string
      snapshot_version:
        description: Snapshot version in YYYY-MM-DD format
        required: true
        type: string
      publish:
        description: Publish the validated snapshot to GitHub Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cno-snapshot-publication
  cancel-in-progress: false

jobs:
  build-cno:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install build dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::cli
            any::DBI
            any::digest
            any::duckdb
            any::jsonlite
            any::yaml

      - name: Download and extract source archive
        env:
          CNO_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          mkdir -p data-raw/cno_source
          curl --fail --location --http1.1 \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 10 \
            --retry-max-time 3600 \
            --connect-timeout 30 \
            --max-time 3600 \
            --continue-at - \
            --user-agent "realestatebr data pipeline" \
            --output "$RUNNER_TEMP/cno.zip" \
            "$CNO_SOURCE_URL"
          unzip -t -q "$RUNNER_TEMP/cno.zip"
          unzip -q "$RUNNER_TEMP/cno.zip" -d data-raw/cno_source

      - name: Build and validate Parquet snapshot
        env:
          CNO_VERSION: ${{ inputs.snapshot_version }}
        run: |
          source_dir=$(dirname "$(find data-raw/cno_source -type f -iname 'cno.csv' -print -quit)")
          if [ -z "$source_dir" ] || [ ! -f "$source_dir/cno.csv" ]; then
            echo "The source archive does not contain cno.csv" >&2
            exit 1
          fi
          export CNO_SOURCE_DIR="$source_dir"
          Rscript -e '
            source("data-raw/cno/build_snapshot.R")
            build_cno_snapshot(
              source_dir = Sys.getenv("CNO_SOURCE_DIR"),
              version = Sys.getenv("CNO_VERSION")
            )
          '

      - name: Upload validated snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: cno-${{ inputs.snapshot_version }}
          path: data-raw/cno_output/${{ inputs.snapshot_version }}/
          if-no-files-found: error
          retention-days: 7

      - name: Publish immutable snapshot release
        if: ${{ inputs.publish }}
        env:
          CNO_VERSION: ${{ inputs.snapshot_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_dir="data-raw/cno_output/$CNO_VERSION"
          release_tag="cno-$CNO_VERSION"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            existing_dir="$RUNNER_TEMP/cno-existing-release"
            mkdir -p "$existing_dir"
            gh release download "$release_tag" \
              --pattern manifest.json \
              --dir "$existing_dir"
            jq -S 'del(.retrieved_at)' \
              "$existing_dir/manifest.json" > "$RUNNER_TEMP/existing-release.json"
            jq -S 'del(.retrieved_at)' \
              "$snapshot_dir/manifest.json" > "$RUNNER_TEMP/generated-release.json"
            if ! cmp -s \
              "$RUNNER_TEMP/existing-release.json" \
              "$RUNNER_TEMP/generated-release.json"; then
              echo "Release $release_tag already exists for different source data" >&2
              exit 1
            fi

            printf '%s\n' \
              constructions.parquet \
              areas.parquet \
              cnaes.parquet \
              responsibilities.parquet \
              manifest.json | sort > "$RUNNER_TEMP/expected-assets.txt"
            gh release view "$release_tag" \
              --json assets \
              --jq '.assets[].name' | sort > "$RUNNER_TEMP/existing-assets.txt"
            if ! cmp -s \
              "$RUNNER_TEMP/expected-assets.txt" \
              "$RUNNER_TEMP/existing-assets.txt"; then
              echo "Release $release_tag does not contain the expected assets" >&2
              exit 1
            fi
          else
            gh release create "$release_tag" \
              "$snapshot_dir/constructions.parquet" \
              "$snapshot_dir/areas.parquet" \
              "$snapshot_dir/cnaes.parquet" \
              "$snapshot_dir/responsibilities.parquet" \
              "$snapshot_dir/manifest.json" \
              --target "$GITHUB_SHA" \
              --title "CNO snapshot $CNO_VERSION" \
              --notes "Validated CNO Parquet snapshot for $CNO_VERSION." \
              --latest=false
          fi

      - name: Update latest snapshot pointer
        if: ${{ inputs.publish }}
        env:
          CNO_VERSION: ${{ inputs.snapshot_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="cno-$CNO_VERSION"
          manifest_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}/manifest.json"
          jq -n \
            --arg version "$CNO_VERSION" \
            --arg manifest_url "$manifest_url" \
            '{dataset: "cno", version: $version, manifest_url: $manifest_url}' \
            > "$RUNNER_TEMP/latest.json"

          if gh release view cno-v2-latest >/dev/null 2>&1; then
            gh release upload cno-v2-latest "$RUNNER_TEMP/latest.json" --clobber
          else
            gh release create cno-v2-latest "$RUNNER_TEMP/latest.json" \
              --target "$GITHUB_SHA" \
              --title "Latest CNO snapshot" \
              --notes "Pointer to the current validated CNO snapshot." \
              --latest=false
          fi
